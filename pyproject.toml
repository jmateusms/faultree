[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "faultree"
version = "0.3.0"
description = "Fault Tree Analysis using BDDs"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "João Mateus Santana", email = "jmateussan@gmail.com"}
]
keywords = ["fault-tree", "bdd", "reliability", "safety"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
]
dependencies = [
    "dd>=0.5",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "openpyxl>=3.0.0",
]

[project.optional-dependencies]
server = ["fastapi", "uvicorn"]
test = ["pytest", "httpx"]
all = ["fastapi", "uvicorn", "pytest", "httpx"]

[project.scripts]
faultree = "faultree.cli:main"

[project.urls]
Homepage = "https://github.com/jmateusms/faultree"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # dd's BDD.__del__ inspects the stack during GC, which is noisy on 3.14
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
