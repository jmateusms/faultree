name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[server,test]"
      - name: Test
        run: python -m pytest -q

  gui-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check of the GUI scripts
        run: |
          set -e
          files=$(find faultree/gui/static -type f \( -name '*.js' -o -name '*.mjs' \) | sort)
          test -n "$files"
          for f in $files; do node --check "$f"; echo "ok $f"; done
